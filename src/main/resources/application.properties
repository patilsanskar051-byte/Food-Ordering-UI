# Application name
spring.application.name=crave

# H2 file-based database (persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/cravedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (for debugging — visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File Handling & Data Directory
crave.data.dir=./data
crave.receipts.dir=./data/receipts
crave.order-history.file=./data/order-history.jsonl
crave.menu-overrides.file=./data/menu-overrides.json

# Admin API Protection Key (Configurable via CRAVE_ADMIN_TOKEN env variable with dev fallback)
crave.admin.secret=${CRAVE_ADMIN_TOKEN:crave-admin-secret-2026}

# Google OAuth 2.0 Web Client ID
crave.google.client-id=${GOOGLE_CLIENT_ID:755498069210-a53fiibrvm5gd8vkvkdjv88re3ae5prj.apps.googleusercontent.com}

# Servlet Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=CRAVE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
